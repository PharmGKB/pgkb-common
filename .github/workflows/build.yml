name: Build & Tests

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"

jobs:
  build:
    name: Build and Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Build and test
        # javadoc (not just test) so a doclint break is caught here, not mid-publish in release.yml - not
        # `./gradlew build`, which also pulls in the sign* tasks; those fall back to reading a local
        # ~/.gnupg/secring.gpg when no signing key is configured (which it isn't in this workflow), so they'd
        # fail this job on every push
        run: ./gradlew test javadoc

      - name: Codecov
        uses: codecov/codecov-action@v7
        with:
          files: ./build/reports/jacoco/test/jacocoTestReport.xml
          # 'files' adds to the action's own search for coverage files rather than replacing it
          disable_search: true
          flags: unittests

      - name: Get commit header
        id: commit-msg
        if: failure()
        # only the subject line: a full commit body can run past Slack's 3000-character limit on a text field,
        # and Slack then rejects the whole message
        run: echo "header=$(git log -1 --format=%s)" >> "$GITHUB_OUTPUT"

      - name: Send Slack notification on failure
        if: failure()
        uses: slackapi/slack-github-action@v4
        with:
          method: chat.postMessage
          token: ${{ secrets.SLACK_NOTIFICATIONS_BOT_TOKEN }}
          # C0C9UT8MZLM is #ops-ci
          payload: |
            {
              "channel": "C0C9UT8MZLM",
              "attachments": [{
                "color": "#ff0000",
                "blocks": [
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": ":stop: <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|FAILED ${{ github.workflow }}!>"
                    }
                  },
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": "Triggered by ${{ github.event_name }} on <${{ github.event.pull_request.html_url || github.event.head_commit.url }}|${{ github.ref_name }}> by ${{ github.actor }}."
                    }
                  },
                  {
                    "type": "context",
                    "elements": [
                      {
                        "type": "mrkdwn",
                        "text": ${{ toJSON(format('Last commit: {0}', steps.commit-msg.outputs.header)) }}
                      }
                    ]
                  }
                ]
            }]
            }
