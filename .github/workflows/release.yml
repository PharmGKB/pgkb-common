name: Upload to Maven Central

on:
  release:
    types: [published]

jobs:
  release:
    name: Upload to Maven Central
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set appVersion
        id: appVersion
        # github.ref for a tag push is "refs/tags/v1.2.3" - strip the "refs/tags/v" prefix to get "1.2.3".
        # Previously done via bhowell2/github-substring-action@v1, which is unmaintained and declares a
        # node16 runtime - removed from GitHub-hosted runners entirely since November 2024. A plain shell
        # parameter expansion does the same one thing without depending on a third-party action at all.
        run: echo "substring=${GITHUB_REF#refs/tags/v}" >> "$GITHUB_OUTPUT"

      - run: echo "Version = ${{steps.appVersion.outputs.substring}}"

      - name: Set up JDK
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: gradle

      - name: Check version
        # build.gradle takes the version from `git describe --tags` and falls back to 0.0.0 if that fails;
        # a release published under the wrong version can't be removed from Maven Central
        run: |
          gradleVersion=$(./gradlew -q printVersion | tail -n 1)
          if [[ "$gradleVersion" != "${{ steps.appVersion.outputs.substring }}" ]]; then
            echo "::error::Gradle version '$gradleVersion' doesn't match release tag '${{ steps.appVersion.outputs.substring }}'"
            exit 1
          fi

      - name: Build and test
        # javadoc (not just test) so a doclint break fails here, before the publish step below - not
        # `./gradlew build`, which also pulls in the sign* tasks; SIGNING_KEY/SIGNING_PASSWORD aren't set for
        # this step (only for "Publish to Maven Central" below), so they'd fail this job before publishing
        run: ./gradlew test javadoc

      - name: Publish to Maven Central
        run: ./gradlew publishToSonatype closeAndReleaseSonatypeStagingRepository
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          SIGNING_PASSWORD: ${{ secrets.SIGNING_PASSWORD }}
          SONATYPE_USERNAME: ${{ secrets.SONATYPE_USERNAME }}
          SONATYPE_PASSWORD: ${{ secrets.SONATYPE_PASSWORD }}

      - name: Send Slack notification on failure
        if: failure()
        uses: slackapi/slack-github-action@v1
        with:
          channel-id: 'C0C9UT8MZLM'  # #ops-ci
          payload: |
            {
              "attachments": [{
                "color": "#ff0000",
                "blocks": [
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": ":stop: <https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}|FAILED ${{ github.workflow }}!>"
                    }
                  },
                  {
                    "type": "section",
                    "text": {
                      "type": "mrkdwn",
                      "text": "Triggered by ${{ github.event_name }} on <${{ github.event.pull_request.html_url || github.event.head_commit.url }}|${{ github.ref_name }}> by ${{ github.actor }}."
                    }
                  },
                  {
                    "type": "context",
                    "elements": [
                      {
                        "type": "mrkdwn",
                        "text": "Last commit:"
                      },
                      {
                        "type": "mrkdwn",
                        "text": ${{ toJSON(github.event.head_commit.message || '(none)') }}
                      }
                    ]
                  }
                ]
            }]
            }
        env:
          SLACK_BOT_TOKEN: ${{ secrets.SLACK_NOTIFICATIONS_BOT_TOKEN }}
